[package]
name = "decoderd"
description = "Standalone OBD decode binary: JSON-lines stdin -> decoded JSON stdout (Telegraf execd processor)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "decoderd"
path = "src/main.rs"

[dependencies]
decode = { path = "../decode" }
# JSON-lines wire format (execd processor + equivalence-harness target). serde
# lives here, not in the pure `decode` library, so the lib stays dependency-free.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
