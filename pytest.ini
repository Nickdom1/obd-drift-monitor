[pytest]
# Pytest configuration for OBD Drift Monitor

pythonpath = .

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Paths to search for tests
testpaths = pkgs

# Output options
addopts =
    --verbose
    --strict-markers
    --tb=short
    --color=yes

# Markers for categorizing tests
markers =
    unit: Unit tests (fast, no I/O)
    integration: Integration tests (may require hardware)
    slow: Slow-running tests
    synthetic: Tests using hand-built synthetic payloads
    real: Tests using real car capture fixtures

# Coverage options (when running with --cov)
# Example: pytest --cov=pkgs --cov-report=html

# Ignore patterns
norecursedirs = .git .nix-store __pycache__ *.egg-info

# Minimum Python version
minversion = 3.9
